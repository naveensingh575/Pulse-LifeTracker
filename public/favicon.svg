<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Dark Navy Slate Background Gradient -->
    <linearGradient id="pulseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Radial Ambient Center Glow -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Pulse Waveform Multi-stop Gradient -->
    <linearGradient id="pulseWave" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="30%" stop-color="#06b6d4"/>
      <stop offset="65%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Outer Blur Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Edge-to-Edge Canvas (100% fill, zero margins, no white border) -->
  <rect width="512" height="512" fill="url(#pulseBg)"/>
  <rect width="512" height="512" fill="url(#pulseGlow)"/>

  <!-- Outer Soft Glow Waveform -->
  <path
    d="M 51.2 266.24 L 122.88 266.24 L 163.84 327.68 L 225.28 112.64 L 286.72 399.36 L 343.04 204.8 L 389.12 266.24 L 460.8 266.24"
    stroke="url(#pulseWave)"
    stroke-width="48"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.4"
    filter="url(#glowFilter)"
  />

  <!-- High Vitality Pulse Waveform -->
  <path
    d="M 51.2 266.24 L 122.88 266.24 L 163.84 327.68 L 225.28 112.64 L 286.72 399.36 L 343.04 204.8 L 389.12 266.24 L 460.8 266.24"
    stroke="url(#pulseWave)"
    stroke-width="33.28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Apex Peak Glowing Spark -->
  <circle cx="225.28" cy="112.64" r="28.16" fill="#38bdf8" opacity="0.6"/>
  <circle cx="225.28" cy="112.64" r="12.8" fill="#ffffff"/>
</svg>
