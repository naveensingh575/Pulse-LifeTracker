<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="pulseBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10b981"/>
      <stop offset="50%" stopColor="#06b6d4"/>
      <stop offset="100%" stopColor="#6366f1"/>
    </linearGradient>
    <linearGradient id="pulseWave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#10b981"/>
      <stop offset="45%" stopColor="#06b6d4"/>
      <stop offset="100%" stopColor="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Gradient Outer Frame -->
  <rect width="32" height="32" rx="8" fill="url(#pulseBorder)"/>

  <!-- Light Theme Crisp White Background -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.8" fill="#ffffff"/>

  <!-- High-Peak Vitality Pulse Waveform -->
  <path
    d="M4 17h4l3 3.5 5-14.5 4.5 17 4-9.5 2.5 4H28"
    stroke="url(#pulseWave)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Glowing Summit Apex Spark -->
  <circle cx="16" cy="6" r="2.2" fill="#0284c7"/>
  <circle cx="16" cy="6" r="1.2" fill="#38bdf8"/>
</svg>
